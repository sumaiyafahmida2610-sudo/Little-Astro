<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Astro’s Adventure | Mission Briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* page-only layout tweaks (no new colors or fonts) */
    #line { min-height: 7.5rem; margin: 0; font-size: 1.15rem; }
    @media (max-width: 700px) {
      .page-start .screen { justify-content: flex-end; padding-top: 1rem; }
      .vignette { background: linear-gradient(0deg, rgba(2,4,10,.92) 0%, rgba(2,4,10,.35) 50%, transparent 75%); }
    }
  </style>
</head>
<body class="page-start">

  <div class="stars" id="stars" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="screen">
    <div class="hero" style="width:min(30rem,100%)">

      <span class="chip chip-mint">      Mission Briefing</span>
      <h1 class="h2" style="margin-top:.8rem">Incoming transmission</h1>

      <section class="panel" style="text-align:left">
        <p id="line" aria-live="polite"></p>
        <div class="chip-row" id="chips" style="justify-content:flex-start;margin-top:.8rem;min-height:2rem"></div>
      </section>

      <div class="actions" style="margin-top:1.6rem;justify-content:space-between">
        <a class="btn btn-ghost" href="index.html">Back</a>
        <button class="btn btn-play" type="button" id="ok-btn">OK</button>
      </div>

      <button class="btn btn-ghost" type="button" id="sound-btn" style="margin-top:1.2rem;padding:.4rem 1.1rem;font-size:.85rem">Sound: On</button>

      <div class="level">
        <span id="count">Message 1 of 5</span>
        <div class="level-bar"><div class="level-fill" id="fill" style="--pct:20%"></div></div>
      </div>

    </div>
  </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="app.js"></script>
   <script src="stars.js"></script>    
  <script src="briefing.js"></script>
</body>
</html>
