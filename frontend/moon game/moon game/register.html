  <style>
    /* ===== page-only: spacecraft cockpit background (cabin.svg) ===== */
    .cabin { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* ===== page-only: avatar + speech ===== */
    .screen { padding-bottom: 14vh; }
    .talk { display: flex; align-items: flex-end; gap: 1rem; text-align: left; }
    .talk .avatar { width: 7.5rem; flex: none; }
    .talk .panel { flex: 1; min-height: 5.5rem; padding: 1rem 1.2rem; }
    #say { margin: 0; font: 600 1.25rem/1.4 var(--font-body); }
    .avatar .head { transform-origin: 60px 60px; }
    .avatar .armR { transform-origin: 88px 70px; }
    .avatar.talk .head { animation: nod .3s ease-in-out infinite alternate; }
    .avatar.talk .armR { animation: wave .5s ease-in-out infinite alternate; }
    @keyframes nod  { to { transform: rotate(-3deg) translateY(1px); } }
    @keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(-55deg); } }
    button.chip { cursor: pointer; font: inherit; font-size: .85rem; color: var(--white); }
    button.chip:hover { background: rgba(255,255,255,.18); }
    .review-line { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-bottom: 1px solid var(--line); }
    .review-line:last-of-type { border-bottom: 0; }
    .dot { display: inline-block; width: 1rem; height: 1rem; border-radius: 50%; vertical-align: middle; border: 2px solid var(--white); }
    @media (max-width: 520px) {
      .talk { flex-direction: column; align-items: center; }
      .talk .panel { width: 100%; }
      #say { font-size: 1.1rem; }
    }
  </style>
</head>
